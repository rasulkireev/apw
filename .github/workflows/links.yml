name: Links

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: links-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  internal-links:
    name: Internal links
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Check internal links
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411
        with:
          args: >-
            --config lychee.toml
            --quiet
            --offline
            --index-files index.html
            --root-dir "${{ github.workspace }}/dist"
            './dist/**/*.html'
            './dist/**/*.xml'
            './dist/**/*.txt'
          fail: true
          jobSummary: true

  external-links:
    name: External links
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Restore lychee cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .lycheecache
          key: lychee-${{ github.repository }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            lychee-${{ github.repository }}-${{ github.ref_name }}-
            lychee-${{ github.repository }}-

      - name: Check links
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411
        with:
          args: >-
            --config lychee.toml
            --quiet
            --cache
            --max-cache-age 7d
            --skip-missing
            './README.md'
            './CHANGELOG.md'
            './src/**/*.md'
            './src/**/*.mdx'
            './src/**/*.astro'
            './src/**/*.js'
            './src/**/*.jsx'
            './src/**/*.ts'
            './src/**/*.tsx'
          fail: false
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
