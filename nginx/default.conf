server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Exact article owners/aliases precede ordinary directory serving. Hubs,
    # tags, assets and missing routes retain the stock nginx behavior.
    include /etc/nginx/canonical-locations.conf;
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
