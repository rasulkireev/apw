# CapRover is the sole ingress; trust only its local overlay, never arbitrary client headers.
set_real_ip_from 10.0.1.0/24;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
limit_req_zone $binary_remote_addr zone=newsletter:1m rate=1r/m;

server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    location = /api/newsletter {
        client_max_body_size 4k;
        limit_req zone=newsletter burst=4 nodelay;
        limit_req_status 429;
        access_log off;
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host www.rasulkireev.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
    }

    # Exact article owners/aliases precede ordinary directory serving. Hubs,
    # tags, assets and missing routes retain the stock nginx behavior.
    include /etc/nginx/canonical-locations.conf;
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
